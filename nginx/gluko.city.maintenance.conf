# Режим обслуживания gluko.city (системный nginx)
server {
    listen 80;
    server_name www.gluko.city;
    return 301 http://gluko.city$request_uri;
}

server {
    listen 80;
    server_name gluko.city;
    default_type text/html;
    location / {
        return 200 '<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ведутся работы - Глюкоград</title></head><body style="font-family:sans-serif;background:#0a0a0b;color:#fbe7e7;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0"><div style="text-align:center;padding:2rem"><h1>Ведутся работы</h1><p>Мы обновляемся.</p></div></body></html>';
    }
    access_log /var/log/nginx/gluko.city.access.log;
    error_log /var/log/nginx/gluko.city.error.log;
}
